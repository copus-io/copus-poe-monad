name: Monad verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:demo
      - run: pnpm circuit:build:v2
      - run: cmp zk-v2-build/poe-v2_js/poe-v2.wasm zk-v2-artifacts/poe-v2.wasm
      - run: cd zk-v2-artifacts && sha256sum -c SHA256SUMS
      - run: pnpm test
      - run: pnpm test:product
